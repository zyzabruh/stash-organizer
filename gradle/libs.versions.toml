[versions]
mod-version = "0.1.0"

# Fabric (https://fabricmc.net/develop)
minecraft = "1.21.11"
yarn-mappings = "1.21.11+build.3"
fabric-loader = "0.18.2"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.14-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "1.21.11-SNAPSHOT"

# Baritone (optional, compile only)
baritone = "1.21.11-SNAPSHOT"

# Xaero's (optional at runtime, compile only)
xaeros-minimap = "fabric-1.21.11-25.3.10"
xaeros-world-map = "fabric-1.21.11-1.40.11"
xaeroplus = "2.30.8+fabric-1.21.11"

# Tests
junit = "5.11.3"

# Mods

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn = { module = "net.fabricmc:yarn", version.ref = "yarn-mappings" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Baritone
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }

# Xaero's
xaeros-minimap = { module = "maven.modrinth:xaeros-minimap", version.ref = "xaeros-minimap" }
xaeros-world-map = { module = "maven.modrinth:xaeros-world-map", version.ref = "xaeros-world-map" }
xaeroplus = { module = "maven.modrinth:xaeroplus", version.ref = "xaeroplus" }

# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }

# Mods

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
